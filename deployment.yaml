apiVersion: v1
kind: Namespace
metadata:
  name: spandana2004 

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-dashboard-deployment
  namespace: spandana2004 

spec:
  replicas: 2 # You can start with 1 or 2 replicas for redundancy

  selector:
    matchLabels:
      app: stock-dashboard

  template:
    metadata:
      labels:
        app: stock-dashboard

    spec:
      containers:
        - name: stock-dashboard-container
          image: IMAGE_PLACEHOLDER # This will be replaced by Jenkins
          ports:
            - containerPort: 5000
          env: # Set NODE_ENV to production inside the container
            - name: NODE_ENV
              value: "production"

---
apiVersion: v1
kind: Service
metadata:
  name: stock-dashboard-service
  namespace: spandana2004 # <<< Use the same unique namespace name

spec:
  selector:
    app: stock-dashboard # Selects pods with the label 'app: stock-dashboard'

  ports:
    - protocol: TCP
      port: 80 # The port the service will listen on (standard HTTP)
      targetPort: 5000 # The port your container is listening on

  type: LoadBalancer # This will expose your service externally with a public IP in AKS
